name: Build and publish Docker image

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    MINVER_CLI_VERSION: 4.3.0

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Run tests
                run: |
                    dotnet test \
                      --no-restore \
                      --verbosity normal \
                      --logger "trx;LogFileName=test-results.trx" \
                      --logger "html;LogFileName=test-results.html" \
                      --results-directory ./TestResults

            -   name: Generate Rich Test Summary
                if: always()
                run: python3 .github/scripts/generate_test_summary.py

            -   name: Generate Test Catalog
                if: always()
                run: python3 .github/scripts/generate_test_catalog.py

            -   name: Upload Test Results Artifact
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: test-reports
                    path: |
                        ./TestResults/test-results.trx
                        ./TestResults/test-results.html
                        ./TestResults/test-catalog.md
                    retention-days: 14

    publish-test-catalog-and-docs:
        runs-on: ubuntu-latest
        needs: [ test ]
        if: github.event_name == 'pull_request'
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ github.head_ref }}
            -   uses: actions/download-artifact@v8
                with:
                    name: test-reports
                    path: ./downloaded
            -   name: Run directory tree updater
                run: python3 .github/scripts/update_docs.py
            -   name: Commit updates to PR branch
                run: |
                    cp ./downloaded/test-catalog.md docs/test-catalog.md
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add docs/test-catalog.md README.md docs/clean-architecture.md
                    git diff --cached --quiet && exit 0
                    git commit -m "chore: update test catalog and directory trees [skip ci]"
                    git push

    deploy-docs:
        runs-on: ubuntu-latest
        needs: [ test ]
        if: github.event_name == 'push'
        permissions:
            contents: write
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Download test reports artifact
                uses: actions/download-artifact@v8
                with:
                    name: test-reports
                    path: ./downloaded

            -   name: Inject fresh test catalog into docs
                run: cp ./downloaded/test-catalog.md docs/test-catalog.md

            -   name: Set up Python
                uses: actions/setup-python@v6
                with:
                    python-version: '3.x'

            -   name: Install MkDocs dependencies
                run: pip install mkdocs-material mkdocs-glightbox

            -   name: Deploy docs to GitHub Pages
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    mkdocs gh-deploy --force

    container-smoke:
        runs-on: ubuntu-latest
        needs: test

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Build runtime image
                run: docker build -t obfuscal-api:ci .

            -   name: Start postgres for smoke test
                run: |
                    docker network create obfuscal-ci
                    docker run -d --name obfuscal-ci-db --network obfuscal-ci \
                      -e POSTGRES_USER=postgres \
                      -e POSTGRES_PASSWORD=postgres \
                      -e POSTGRES_DB=obfuscal \
                      --health-cmd="pg_isready -U postgres" \
                      --health-interval=5s \
                      --health-timeout=5s \
                      --health-retries=20 \
                      postgres:18

            -   name: Wait for postgres health
                run: |
                    for i in {1..30}; do
                      state=$(docker inspect --format='{{json .State.Health.Status}}' obfuscal-ci-db)
                      if [ "$state" = '"healthy"' ]; then
                        exit 0
                      fi
                      sleep 2
                    done
                    docker logs obfuscal-ci-db
                    exit 1

            -   name: Start API container
                run: |
                    docker run -d --name obfuscal-ci-api --network obfuscal-ci -p 18080:8080 \
                      -e ApplyMigrationsOnStartup=true \
                      -e ASPNETCORE_ENVIRONMENT=Development \
                      -e ASPNETCORE_URLS=http://+:8080 \
                      -e ConnectionStrings__DefaultConnection='Host=obfuscal-ci-db;Database=obfuscal;Username=postgres;Password=postgres' \
                      -e AzureAd__TenantId='11111111-1111-1111-1111-111111111111' \
                      -e AzureAd__ClientId='22222222-2222-2222-2222-222222222222' \
                      -e AzureAd__ClientSecret='smoke-test-placeholder' \
                      -e GraphConsent__ClientId='33333333-3333-3333-3333-333333333333' \
                      -e ColumnEncryption__Key='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' \
                      obfuscal-api:ci

            -   name: Smoke test health endpoint
                run: |
                    for i in {1..40}; do
                      if curl -fsS http://localhost:18080/health > /dev/null; then
                        exit 0
                      fi
                      sleep 2
                    done
                    docker logs obfuscal-ci-api
                    exit 1

            -   name: Cleanup smoke test containers
                if: always()
                run: |
                    docker rm -f obfuscal-ci-api obfuscal-ci-db || true
                    docker network rm obfuscal-ci || true

    mutation-testing:
        runs-on: ubuntu-latest
        needs: [ test ]
        env:
            MUTATION_ARTIFACT_NAME: mutation-reports
            GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Build solution
                run: dotnet build --no-restore --no-incremental

            -   name: Install Stryker .NET tool
                run: dotnet tool restore

            -   name: Run Stryker mutation tests
                env:
                    STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
                run: |
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                      ISSUE="${{ github.head_ref }}"
                    else
                      ISSUE="${{ github.ref_name }}"
                    fi
                    COMMIT=$(git log -1 --format=%s | tr ' ' '-')
                    VERSION="${ISSUE}/${COMMIT}"
                    dotnet stryker --version "$VERSION"

            -   name: Generate Mutation Summary
                if: always()
                run: python3 .github/scripts/generate_mutation_summary.py

            -   name: Upload Mutation Reports Artifact
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ env.MUTATION_ARTIFACT_NAME }}
                    path: |
                        ./StrykerOutput/**/reports/mutation-report.html
                        ./StrykerOutput/**/reports/mutation-report.json
                    if-no-files-found: warn
                    retention-days: 14

    generate-sql-migration:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Install EF Core CLI
                run: dotnet tool install --global dotnet-ef

            -   name: Generate Idempotent SQL Script
                run: |
                    dotnet ef migrations script \
                      --idempotent \
                      --project ObfusCal.Infrastructure/ObfusCal.Infrastructure.csproj \
                      --startup-project ObfusCal.Api/ObfusCal.Api.csproj \
                      --output ./db-migration.sql

            -   name: Upload SQL Script Artifact
                uses: actions/upload-artifact@v7
                with:
                    name: database-migration-script
                    path: ./db-migration.sql
                    retention-days: 14

    build:
        runs-on: ubuntu-latest
        needs: [ test, container-smoke, generate-sql-migration ]
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    global-json-file: global.json

            -   name: Install MinVer CLI
                run: dotnet tool install --global minver-cli --version ${{ env.MINVER_CLI_VERSION }}

            -   name: Restore dependencies
                run: dotnet restore ObfusCal.Api/ObfusCal.Api.csproj

            -   name: Determine semantic version
                id: version
                shell: bash
                run: |
                    VERSION=$(minver --tag-prefix v --minimum-major-minor 1.0)
                    VERSION=${VERSION//$'\r'/}
                    MAJOR=${VERSION%%.*}
                    VERSION_NO_METADATA=${VERSION%%+*}
                    CORE=${VERSION_NO_METADATA%%-*}
                    IFS='.' read -r _ MINOR PATCH <<< "$CORE"
                    ASSEMBLY_VERSION="${MAJOR}.0.0.0"
                    FILE_VERSION="${MAJOR}.${MINOR}.${PATCH}.0"
                    INFORMATIONAL_VERSION="${VERSION}+${GITHUB_SHA}"
                    echo "semver=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "assembly_version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
                    echo "file_version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
                    echo "informational_version=$INFORMATIONAL_VERSION" >> "$GITHUB_OUTPUT"

            -   name: Log in to GHCR
                if: github.event_name == 'push'
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                    tags: |
                        type=raw,value=${{ steps.version.outputs.semver }},enable=${{ github.event_name == 'push' }}
                        type=raw,value=v${{ steps.version.outputs.semver }},enable=${{ github.event_name == 'push' }}
                        type=raw,value=latest,enable=${{ github.event_name == 'push' }}
                        type=sha,format=short

            -   name: Build and push
                uses: docker/build-push-action@v7
                with:
                    context: .
                    push: ${{ github.event_name == 'push' }}
                    build-args: |
                        VERSION=${{ steps.version.outputs.semver }}
                        ASSEMBLY_VERSION=${{ steps.version.outputs.assembly_version }}
                        FILE_VERSION=${{ steps.version.outputs.file_version }}
                        INFORMATIONAL_VERSION=${{ steps.version.outputs.informational_version }}
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
