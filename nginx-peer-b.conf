events {}

http {
    upstream obfuscal_api {
        server api-b:8443;
    }

    # No port 80 block — instance A owns :80 on the host.
    # Instance B is reachable at https://localhost:4443 from the browser
    # and at https://proxy-b from within the compose network.
    #
    # $http_host is used instead of $host so the non-standard port (4443) is
    # preserved in forwarded headers. $host strips the port, which causes
    # ASP.NET Core to generate redirect URLs without the port (e.g. after OIDC).

    server {
        listen 443 ssl;
        server_name proxy-b localhost;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /_blazor {
            proxy_pass https://obfuscal_api;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass https://obfuscal_api;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
