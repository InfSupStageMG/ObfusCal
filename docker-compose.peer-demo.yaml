# Two-instance peer demo stack — run both ObfusCal instances on one machine.
#
# Usage:
#   podman compose -f docker-compose.peer-demo.yaml --env-file .env.peer-demo up -d --build
#   podman compose -f docker-compose.peer-demo.yaml --env-file .env.peer-demo down
#
# Instance A: https://localhost   (also handles http→https on :80)
# Instance B: https://localhost:4443
#
# After both instances are healthy, log in to each and use the sysadmin
# Peer Connections page to wire them together.
# Use these URLs when registering the peer connection in each instance:
#   From A → register B as:  https://proxy-b   (resolved inside the compose network)
#   From B → register A as:  https://proxy-a   (resolved inside the compose network)
#
# Entra app registration — add both redirect URIs:
#   https://localhost/signin-oidc
#   https://localhost:4443/signin-oidc

services:

  # ── Instance A ─────────────────────────────────────────────────────────────

  db-a:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER_A}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_A}
      POSTGRES_DB: ${POSTGRES_DB_A}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_A} -d ${POSTGRES_DB_A}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - peer-demo

  api-a:
    build: .
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-4.0}
    expose:
      - "8443"
    environment:
      - ApplyMigrationsOnStartup=true
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-a;Database=${POSTGRES_DB_A};Username=${POSTGRES_USER_A};Password=${POSTGRES_PASSWORD_A}
      - AZUREAD__TENANTID=${AZUREAD__TENANTID}
      - AZUREAD__CLIENTID=${AZUREAD__CLIENTID}
      - AZUREAD__CLIENTSECRET=${AZUREAD__CLIENTSECRET}
      - GRAPHCONSENT__CLIENTID=${GRAPHCONSENT__CLIENTID}
      - GRAPHCONSENT__CLIENTSECRET=${GRAPHCONSENT__CLIENTSECRET}
      - GOOGLECONSENT__CLIENTID=${GOOGLECONSENT__CLIENTID}
      - GOOGLECONSENT__CLIENTSECRET=${GOOGLECONSENT__CLIENTSECRET}
      - GOOGLECONSENT__REDIRECTURI=${GOOGLECONSENT__REDIRECTURI}
      - SYNC__INSTANCEID=info-support
      - SYNC__APIKEY=${SYNC__APIKEY_A}
      - COLUMNENCRYPTION__KEY=${COLUMNENCRYPTION__KEY_A}
      - SECURITYAUDIT__FILEPATH=/tmp/obfuscal/security-audit.ndjson
      - PEERTRANSPORTSECURITY__ALLOWSELFSIGNEDCERTS=true
      - PEERTRANSPORTSECURITY__ALLOWPRIVATENETWORKHOSTS=true
      - ASPNETCORE_URLS=https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/api.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${API_CERT_PASSWORD}
    volumes:
      - ./certs/api:/https:ro
      - ./plugins:/app/plugins:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db-a:
        condition: service_healthy
    networks:
      - peer-demo

  proxy-a:
    image: nginx:1.31-alpine
    depends_on:
      api-a:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-peer-a.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx:/etc/nginx/certs:ro
    networks:
      - peer-demo

  # ── Instance B ─────────────────────────────────────────────────────────────

  db-b:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER_B}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_B}
      POSTGRES_DB: ${POSTGRES_DB_B}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_B} -d ${POSTGRES_DB_B}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - peer-demo

  api-b:
    build: .
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${API_MEM_LIMIT:-512m}
    cpus: ${API_CPUS:-4.0}
    expose:
      - "8443"
    environment:
      - ApplyMigrationsOnStartup=true
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-b;Database=${POSTGRES_DB_B};Username=${POSTGRES_USER_B};Password=${POSTGRES_PASSWORD_B}
      - AZUREAD__TENANTID=${AZUREAD__TENANTID}
      - AZUREAD__CLIENTID=${AZUREAD__CLIENTID}
      - AZUREAD__CLIENTSECRET=${AZUREAD__CLIENTSECRET}
      - GRAPHCONSENT__CLIENTID=${GRAPHCONSENT__CLIENTID}
      - GRAPHCONSENT__CLIENTSECRET=${GRAPHCONSENT__CLIENTSECRET}
      - GOOGLECONSENT__CLIENTID=${GOOGLECONSENT__CLIENTID}
      - GOOGLECONSENT__CLIENTSECRET=${GOOGLECONSENT__CLIENTSECRET}
      - GOOGLECONSENT__REDIRECTURI=${GOOGLECONSENT__REDIRECTURI}
      - SYNC__INSTANCEID=katoen-natie
      - SYNC__APIKEY=${SYNC__APIKEY_B}
      - COLUMNENCRYPTION__KEY=${COLUMNENCRYPTION__KEY_B}
      - SECURITYAUDIT__FILEPATH=/tmp/obfuscal/security-audit.ndjson
      - PEERTRANSPORTSECURITY__ALLOWSELFSIGNEDCERTS=true
      - PEERTRANSPORTSECURITY__ALLOWPRIVATENETWORKHOSTS=true
      - ASPNETCORE_URLS=https://+:8443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/api.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${API_CERT_PASSWORD}
    volumes:
      - ./certs/api:/https:ro
      - ./plugins:/app/plugins:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db-b:
        condition: service_healthy
    networks:
      - peer-demo

  proxy-b:
    image: nginx:1.31-alpine
    depends_on:
      api-b:
        condition: service_healthy
    ports:
      # No port 80 — instance A already owns :80 on the host.
      - "4443:443"
    volumes:
      - ./nginx-peer-b.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx:/etc/nginx/certs:ro
    networks:
      - peer-demo

networks:
  peer-demo:
    driver: bridge
